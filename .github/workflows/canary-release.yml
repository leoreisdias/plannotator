name: Canary Release

on:
  push:
    branches:
      - canary
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plannotator-canary-release
  cancel-in-progress: true

jobs:
  release:
    if: github.repository == 'leoreisdias/plannotator'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate canary
        run: |
          bun run typecheck
          bun test

      - name: Build embedded applications
        run: |
          bun run build:review
          bun run build:hook

      - name: Compile canary binaries
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"
          version="$(jq -r .version package.json)-canary.${short_sha}"

          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig --target=bun-darwin-arm64 --define "__CLI_VERSION__=\"${version}\"" --outfile plannotator-darwin-arm64
          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig --target=bun-darwin-x64 --define "__CLI_VERSION__=\"${version}\"" --outfile plannotator-darwin-x64
          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig --target=bun-linux-arm64 --define "__CLI_VERSION__=\"${version}\"" --outfile plannotator-linux-arm64
          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig --target=bun-linux-x64 --define "__CLI_VERSION__=\"${version}\"" --outfile plannotator-linux-x64

          for binary in plannotator-*; do
            sha256sum "$binary" > "${binary}.sha256"
          done

      - name: Publish immutable canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"
          tag="canary-${short_sha}"
          gh release create "$tag" plannotator-* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Plannotator canary ${short_sha}" \
            --notes "Canary build from commit ${GITHUB_SHA}. Install with scripts/install-canary.sh from the canary branch." \
            --latest
